<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="version" content="1.0.0">
<title>Owner page — The Tavern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--soot:#140d08;--oak:#2a1d14;--oak-hi:#4a3322;--candle:#e0b25a;--wine:#9c3a2f;--chalk:#efe4cc;--chalk-dim:#b9a98b;--faint:#8f8169;
  --sign:"Pirata One",Georgia,serif;--body:"Alegreya",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{background:var(--soot)}
body{margin:0;color:var(--chalk);font:1.0625rem/1.55 var(--body);min-height:100vh;background:radial-gradient(ellipse 70% 35% at 50% 0%,rgba(224,178,90,.12),transparent 70%),var(--soot)}
a{color:var(--candle)}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px;border-radius:3px}
.wrap{max-width:64rem;margin:0 auto;padding:0 1.25rem 4rem}
header.top{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:baseline;justify-content:space-between;padding:1.6rem 0 1rem;border-bottom:1px solid rgba(239,228,204,.12)}
header.top h1{margin:0;font:400 2.4rem/1 var(--sign);color:var(--candle)}
header.top p{margin:0;color:var(--chalk-dim)}
h2{margin:2.2rem 0 .8rem;font:400 1.9rem/1.1 var(--sign);color:var(--candle)}
.note{color:var(--chalk-dim);font-size:.95rem;margin:.2rem 0 0}
.gate{margin:3rem 0;padding:1.4rem 1.6rem;border:1px solid rgba(224,178,90,.35);border-radius:6px;background:rgba(224,178,90,.06)}
.gate p{margin:0 0 .6rem}
.gate ol{margin:.4rem 0 0;padding-left:1.3rem;color:var(--chalk-dim)}
.gate code{background:#1d140d;padding:.05rem .35rem;border-radius:4px;color:var(--chalk)}

.bar{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin:.4rem 0 1rem}
.seg{display:inline-flex;border:1px solid var(--oak-hi);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.95rem;background:none;border:0;color:var(--chalk);padding:.35rem .9rem;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--candle);color:#24170c;font-weight:800}
select{font:inherit;font-size:.95rem;color:var(--chalk);background:#1d140d;border:1px solid var(--oak-hi);border-radius:6px;padding:.3rem .5rem}
.btn{font:inherit;font-size:.95rem;cursor:pointer;padding:.3rem .9rem;border-radius:999px;border:1px solid var(--candle);background:transparent;color:var(--candle);font-weight:600}
.btn:hover{background:rgba(224,178,90,.12)}
.btn.bad{border-color:#d67a6c;color:#e79a8d}
.btn:disabled{opacity:.5;cursor:wait}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.8rem}
.tile{padding:.9rem 1rem;border-radius:6px;background:var(--oak);box-shadow:inset 0 0 0 1px var(--oak-hi)}
.tile b{display:block;font:800 2rem/1.1 var(--body);font-variant-numeric:tabular-nums;color:var(--chalk)}
.tile span{color:var(--chalk-dim);font-size:.92rem}
.tile.first b{color:var(--candle)}

.chartcard{margin-top:1rem;padding:1rem 1rem .6rem;border-radius:6px;background:var(--oak);box-shadow:inset 0 0 0 1px var(--oak-hi);position:relative}
.chartcard h3{margin:0 0 .5rem;font-size:1.05rem;font-weight:600}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .grid{stroke:rgba(239,228,204,.1);stroke-width:1}
svg.chart .axis{fill:var(--faint);font:12px var(--body)}
svg.chart .b{fill:var(--candle)}
svg.chart .hit{fill:transparent;cursor:default}
svg.chart g.col:hover .b,svg.chart g.col:focus .b{fill:#f3cf86}
svg.chart g.col:focus{outline:none}
svg.chart g.col:focus .hit{stroke:var(--candle);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:#efe4cc;color:#24170c;border-radius:6px;padding:.3rem .6rem;font-size:.9rem;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;transform:translate(-50%,-100%)}
.tip b{font-size:1.05rem}
details{margin-top:.6rem}
details summary{cursor:pointer;color:var(--chalk-dim);font-size:.95rem}
table{border-collapse:collapse;width:100%;margin-top:.5rem;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.35rem .6rem;border-bottom:1px solid rgba(239,228,204,.1)}
th{color:var(--chalk-dim);font-weight:600}
td.n,th.n{text-align:right}

.fb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8rem}
.msg{padding:1rem 1.1rem;border-radius:6px;background:var(--oak);box-shadow:inset 0 0 0 1px var(--oak-hi);display:flex;flex-direction:column;gap:.55rem}
.msg.done{opacity:.62}
.msg .meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;align-items:center;color:var(--chalk-dim);font-size:.92rem}
.kind{font-weight:800;font-size:.85rem;padding:.05rem .6rem;border-radius:999px;border:1px solid}
.kind.idea{color:var(--candle);border-color:var(--candle)}
.kind.problem{color:#e79a8d;border-color:#d67a6c}
.kind.other{color:var(--chalk-dim);border-color:var(--oak-hi)}
.msg .text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.thumb{padding:0;border:1px solid var(--oak-hi);border-radius:4px;background:#fff;cursor:zoom-in;line-height:0}
.thumb img{max-width:14rem;max-height:9rem;display:block;border-radius:3px}
.empty{padding:1.4rem;text-align:center;color:var(--chalk-dim);border:1px dashed var(--oak-hi);border-radius:6px}
dialog#big{padding:0;border:0;background:transparent;max-width:96vw;max-height:94vh}
dialog#big::backdrop{background:rgba(10,6,3,.85)}
dialog#big img{max-width:96vw;max-height:88vh;display:block;border-radius:4px;background:#fff}
dialog#big button{margin-top:.5rem}
.err{padding:.6rem .8rem;border-radius:6px;background:rgba(156,58,47,.25);border:1px solid var(--wine);color:#f2c1b8}
@media (max-width:560px){header.top h1{font-size:2rem}.tile b{font-size:1.6rem}}
</style>
<script src="../firebase-config.js"></script>
<script src="../account.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Owner page</h1>
    <p><a href="../">Back to The Tavern</a> · <span id="who"></span></p>
  </header>
  <main id="main"><p class="note">Loading…</p></main>
</div>
<dialog id="big" aria-label="Screenshot"><img alt="Screenshot sent with the message"><button class="btn" type="button" onclick="this.closest('dialog').close()">Close</button></dialog>

<script>
"use strict";
const T=window.Tavern,$main=document.getElementById("main");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=new Intl.NumberFormat("en-CA");
const PAGES={home:"Home page","character-sheet":"Character sheet","combat-tracker":"Combat tracker"};
const METRICS=[["browsers","Visitors"],["members","Signed-in visitors"],["signins","Sign-ins"],["signups","New accounts"],["feedback","Messages"],["v_home","Home page visits"],["v_character_sheet","Character sheet visits"],["v_combat_tracker","Combat tracker visits"]];
let STATS={},ACCOUNTS=null,FB=[],range="7d",metric="browsers",fbView="todo",fbKind="";

function dayKey(d){const z=n=>(n<10?"0":"")+n;return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function fmtDay(k,withYear){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-CA",{month:"short",day:"numeric",...(withYear?{year:"numeric"}:{})})}
function lastDays(n){const out=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-i);out.push(dayKey(x))}return out}
function mondayOf(k){const [y,m,d]=k.split("-").map(Number);const x=new Date(y,m-1,d);const wd=(x.getDay()+6)%7;return dayKey(new Date(y,m-1,d-wd))}
function sum(days,f){return days.reduce((t,k)=>t+((STATS[k]&&STATS[k][f])||0),0)}
// buckets: [{label, days[]}]
function buckets(){
  if(range==="12w"){const days=lastDays(84),map=new Map();days.forEach(k=>{const m=mondayOf(k);if(!map.has(m))map.set(m,[]);map.get(m).push(k)});
    return [...map.entries()].slice(-12).map(([m,ds])=>({label:fmtDay(m),long:"Week of "+fmtDay(m,true),days:ds}))}
  return lastDays(range==="30d"?30:7).map(k=>({label:fmtDay(k),long:fmtDay(k,true),days:[k]}));
}

function gate(html){$main.innerHTML=`<div class="gate">${html}</div>`}
async function start(){
  if(!T||!T.available){gate(`<p>Accounts are not switched on for this site, so this page can't work yet.</p><p class="note">Fill in <code>firebase-config.js</code> (see the README).</p>`);return}
  await T.ready;
  const u=T.user();
  if(!u){gate(`<p>Sign in with your owner account on <a href="../">the home page</a>, then come back here.</p>`);return}
  document.getElementById("who").textContent="Signed in as "+u.username;
  if(!(await T.admin.check())){gate(`<p>This page is only for the site owner.</p>
    <p class="note">If you are the owner, mark your account as owner once in the Firebase console:</p>
    <ol><li>Firestore Database → <b>Start collection</b> (or <b>+ Add collection</b>), collection ID <code>admins</code>.</li>
    <li>Document ID: <code>${esc(u.username)}</code>. Add one field, for example <code>since</code> (string) = today's date. Save.</li>
    <li>Reload this page.</li></ol>`);return}
  $main.innerHTML=`<p class="note">Loading the statistics and messages…</p>`;
  try{
    const [st,acc,fb]=await Promise.all([T.admin.stats(),T.admin.accounts().catch(()=>null),T.admin.feedback()]);
    STATS={};st.forEach(d=>STATS[d.id]=d.data);ACCOUNTS=acc;FB=fb.map(d=>({id:d.id,...d.data})).sort((a,b)=>(b.created||0)-(a.created||0));
  }catch(e){gate(`<p class="err">${esc(e.userMessage||"The data couldn't be loaded.")}</p><p class="note">Check that the latest firestore.rules are published in Firebase, then reload.</p>`);return}
  $main.innerHTML=`
    <section aria-labelledby="hStats"><h2 id="hStats">Statistics</h2>
      <div class="bar"><div class="seg" role="group" aria-label="Period" id="rangeSeg">
        <button type="button" data-r="7d">Last 7 days</button><button type="button" data-r="30d">Last 30 days</button><button type="button" data-r="12w">Last 12 weeks</button></div></div>
      <div class="tiles" id="tiles"></div>
      <p class="note">Visitors are counted once per browser per day, so someone who uses two devices counts twice. Nothing identifies who visited.</p>
      <div class="chartcard"><div class="bar" style="margin:0 0 .4rem"><h3 id="chartTitle" style="margin:0"></h3>
        <label style="margin-left:auto">Show <select id="metric">${METRICS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label></div>
        <div id="chart"></div>
        <details><summary>Show as a table</summary><div id="ctable"></div></details>
      </div>
      <div class="chartcard"><h3>Visits per page</h3><div id="pages"></div></div>
    </section>
    <section aria-labelledby="hFb"><h2 id="hFb">Messages</h2>
      <div class="bar"><div class="seg" role="group" aria-label="Which messages" id="fbSeg">
        <button type="button" data-v="todo">To read</button><button type="button" data-v="done">Done</button><button type="button" data-v="all">All</button></div>
        <label>Kind <select id="fbKind"><option value="">All kinds</option><option value="idea">Ideas</option><option value="problem">Problems</option><option value="other">Something else</option></select></label>
        <span class="note" id="fbCount" style="margin:0"></span></div>
      <ul class="fb" id="fbList"></ul>
    </section>`;
  document.getElementById("rangeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){range=b.dataset.r;renderStats()}});
  document.getElementById("metric").addEventListener("change",e=>{metric=e.target.value;renderStats()});
  document.getElementById("fbSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){fbView=b.dataset.v;renderFb()}});
  document.getElementById("fbKind").addEventListener("change",e=>{fbKind=e.target.value;renderFb()});
  document.getElementById("fbList").addEventListener("click",onFbClick);
  renderStats();renderFb();
}

function renderStats(){
  document.querySelectorAll("#rangeSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.r===range)));
  const B=buckets(),all=B.flatMap(b=>b.days),per=range==="12w"?"12 weeks":range==="30d"?"30 days":"7 days";
  const tiles=[["Accounts in total",ACCOUNTS==null?"–":nf.format(ACCOUNTS),"first"],["Visitors, "+per,nf.format(sum(all,"browsers"))],["Signed-in visitors, "+per,nf.format(sum(all,"members"))],
    ["Sign-ins, "+per,nf.format(sum(all,"signins"))],["New accounts, "+per,nf.format(sum(all,"signups"))],["Messages, "+per,nf.format(sum(all,"feedback"))]];
  document.getElementById("tiles").innerHTML=tiles.map(([l,v,c])=>`<div class="tile ${c||""}"><b>${v}</b><span>${esc(l)}</span></div>`).join("");
  const mLabel=METRICS.find(m=>m[0]===metric)[1];
  document.getElementById("chartTitle").textContent=mLabel+(range==="12w"?" per week":" per day");
  const vals=B.map(b=>({label:b.label,long:b.long,v:sum(b.days,metric)}));
  drawBars(document.getElementById("chart"),vals,mLabel);
  document.getElementById("ctable").innerHTML=`<table><thead><tr><th>${range==="12w"?"Week":"Day"}</th><th class="n">${esc(mLabel)}</th></tr></thead><tbody>${vals.slice().reverse().map(r=>`<tr><td>${esc(r.long)}</td><td class="n">${nf.format(r.v)}</td></tr>`).join("")}</tbody></table>`;
  const rows=[["v_home","Home page"],["v_character_sheet","Character sheet"],["v_combat_tracker","Combat tracker"]];
  document.getElementById("pages").innerHTML=`<table><thead><tr><th>Page</th><th class="n">Visits, ${per}</th></tr></thead><tbody>${rows.map(([k,l])=>`<tr><td>${l}</td><td class="n">${nf.format(sum(all,k))}</td></tr>`).join("")}</tbody></table>`;
}

function niceMax(m){if(m<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(m))),n=m/p;return (n<=2?2:n<=5?5:10)*p}
function drawBars(host,vals,label){
  const W=960,H=260,L=40,R=8,Tp=12,Bt=30,iw=W-L-R,ih=H-Tp-Bt,max=niceMax(Math.max(1,...vals.map(v=>v.v)));
  const n=vals.length,slot=iw/n,bw=Math.max(3,Math.min(46,slot-2)),ticks=4,every=n>16?Math.ceil(n/8):1;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} chart">`;
  for(let i=0;i<=ticks;i++){const y=Tp+ih-ih*i/ticks,v=max*i/ticks;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis" x="${L-6}" y="${y+4}" text-anchor="end">${nf.format(v)}</text>`}
  vals.forEach((d,i)=>{const x=L+slot*i+(slot-bw)/2,h=d.v?Math.max(2,ih*d.v/max):0,y=Tp+ih-h,r=Math.min(4,bw/2,h);
    const path=h?`M${x},${Tp+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${Tp+ih}Z`:"";
    s+=`<g class="col" tabindex="0" data-i="${i}" aria-label="${esc(d.long)}: ${d.v}"><rect class="hit" x="${L+slot*i}" y="${Tp}" width="${slot}" height="${ih}"/>${path?`<path class="b" d="${path}"/>`:""}</g>`;
    if(i%every===0||i===n-1)s+=`<text class="axis" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${esc(d.label)}</text>`});
  s+=`</svg><div class="tip" hidden></div>`;host.innerHTML=s;
  const tip=host.querySelector(".tip"),svg=host.querySelector("svg");
  function show(g){const i=+g.dataset.i,d=vals[i],b=g.getBoundingClientRect(),c=host.getBoundingClientRect();
    tip.hidden=false;tip.innerHTML="";const v=document.createElement("b");v.textContent=nf.format(d.v);const t=document.createElement("div");t.textContent=d.long;tip.append(v,t);
    const bar=g.querySelector(".b"),top=bar?bar.getBoundingClientRect().top:b.bottom-20;
    tip.style.left=(b.left+b.width/2-c.left)+"px";tip.style.top=(top-c.top-6)+"px"}
  svg.querySelectorAll("g.col").forEach(g=>{g.addEventListener("pointerenter",()=>show(g));g.addEventListener("focus",()=>show(g));g.addEventListener("pointerleave",()=>tip.hidden=true);g.addEventListener("blur",()=>tip.hidden=true)});
}

function renderFb(){
  document.querySelectorAll("#fbSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===fbView)));
  const isDone=f=>f.status==="done";
  const list=FB.filter(f=>(fbView==="all"||(fbView==="done")===isDone(f))&&(!fbKind||f.kind===fbKind));
  const todo=FB.filter(f=>!isDone(f)).length;
  document.getElementById("fbCount").textContent=`${list.length} shown · ${todo} to read`;
  const kindName={idea:"Idea",problem:"Problem",other:"Something else"};
  document.getElementById("fbList").innerHTML=list.length?list.map(f=>`
    <li class="msg ${isDone(f)?"done":""}" data-id="${esc(f.id)}">
      <div class="meta"><span class="kind ${esc(f.kind)}">${esc(kindName[f.kind]||f.kind)}</span>
        <span>${f.created?new Date(f.created).toLocaleString("en-CA",{dateStyle:"medium",timeStyle:"short"}):""}</span>
        <span>${esc(PAGES[f.page]||f.page)}${f.version?" v"+esc(f.version):""}</span>
        <span>${f.user?"from "+esc(f.user):"anonymous"}</span></div>
      <p class="text">${esc(f.message)}</p>
      ${f.shot?`<div><button class="btn" type="button" data-a="shot">Show the screenshot</button></div>`:""}
      <div class="acts"><button class="btn" type="button" data-a="status">${isDone(f)?"Move back to To read":"Mark as done"}</button>
        <button class="btn bad" type="button" data-a="del">Delete</button></div>
    </li>`).join(""):`<li class="empty">${fbView==="todo"?"No messages to read. Nice!":"No messages here."}</li>`;
}
const shotCache={};
async function onFbClick(e){
  const b=e.target.closest("button");if(!b)return;const li=b.closest("li[data-id]");if(!li)return;
  const f=FB.find(x=>x.id===li.dataset.id);if(!f)return;
  const old=b.textContent;b.disabled=true;
  try{
    if(b.dataset.a==="shot"){b.textContent="Loading…";const d=shotCache[f.id]||(shotCache[f.id]=await T.admin.shot(f.id));
      if(!d){b.textContent="Screenshot not found";return}
      const wrap=b.parentElement;wrap.innerHTML="";const t=document.createElement("button");t.type="button";t.className="thumb";t.setAttribute("aria-label","Open the screenshot full size");
      const im=document.createElement("img");im.src=d;im.alt="Screenshot sent with the message";t.append(im);wrap.append(t);
      t.addEventListener("click",()=>{const dl=document.getElementById("big");dl.querySelector("img").src=d;dl.showModal()});return}
    if(b.dataset.a==="status"){const s=f.status==="done"?"new":"done";await T.admin.setStatus(f.id,s);f.status=s;renderFb();return}
    if(b.dataset.a==="del"){if(!confirm("Delete this message"+(f.shot?" and its screenshot":"")+"? This can't be undone."))return;
      await T.admin.remove(f.id,!!f.shot);FB=FB.filter(x=>x!==f);renderFb();return}
  }catch(err){alert(err.userMessage||"That didn't work. Try again.")}
  finally{if(b.isConnected){b.disabled=false;if(b.textContent==="Loading…")b.textContent=old}}
}
start();
</script>
</body>
</html>
